version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # This action's ref is the Rust/MSRV version, not an action release number.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
