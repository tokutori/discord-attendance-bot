name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.94-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-1.94-cargo-
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run documentation tests
        run: cargo test --locked --doc
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build documentation
        run: cargo doc --locked --no-deps
      - name: Check package contents
        run: cargo package --locked

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit --deny warnings

  container:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build --tag discord-attendance-bot:ci .
