name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.94-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-1.94-cargo-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --locked --workspace --all-targets
      - name: Run documentation tests
        run: cargo test --locked --workspace --doc
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps
      - name: Check dependency boundaries
        run: python scripts/check-boundaries.py

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit --deny warnings

  container:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build --tag discord-attendance-bot:ci .
      - name: Build view image independently
        run: docker build --target view --tag attendance-view:ci .
      - name: Build offline WAL runtime probe
        run: docker build --target wal-probe --tag wal-probe:ci .
      - name: Build PDF probe in view runtime
        run: docker build --target pdf-probe --tag pdf-probe:ci .
      - name: Test readonly mounts, idle recovery, view replacement and PDF runtime
        run: python scripts/check-container-runtime.py
