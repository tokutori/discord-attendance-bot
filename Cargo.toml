[package]
name = "discord-attendance-bot"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
description = "Self-hosted Discord attendance bot for Japanese clubs and teams"
license = "MIT"
repository = "https://github.com/tokutori/discord-attendance-bot"
homepage = "https://github.com/tokutori/discord-attendance-bot"
documentation = "https://docs.rs/discord-attendance-bot"
readme = "README.md"
keywords = ["discord", "attendance", "bot", "sqlite"]
categories = ["command-line-utilities"]

publish = false

[workspace]
members = ["crates/attendance-shared", "crates/attendance-query", "crates/attendance-view"]
default-members = [".", "crates/attendance-shared", "crates/attendance-query", "crates/attendance-view"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
dotenvy = "0.15"
poise = { version = "0.6.2", default-features = false, features = ["cache", "chrono", "handle_panics"] }
# Poiseの既定rustls backendではなく、Serenityへ安全なTLS backendを明示的に供給する。
serenity = { version = "0.12.5", default-features = false, features = ["native_tls_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# SQLx 0.9 permits a compatible libsqlite3-sys range. Pin the bundled SQLite
# so deployments do not silently fall back to a release affected by the
# WAL-reset corruption bug fixed in SQLite 3.51.3.
libsqlite3-sys = "=0.37.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

printpdf = { version = "=0.11.3", default-features = false }
tempfile = "3.20"
attendance-shared = { path = "crates/attendance-shared" }
attendance-query = { path = "crates/attendance-query" }

[dependencies]
serde.workspace = true
serde_json.workspace = true
attendance-shared.workspace = true
attendance-query.workspace = true
anyhow.workspace = true
chrono.workspace = true
dotenvy.workspace = true
poise.workspace = true
serenity.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

tempfile.workspace = true
